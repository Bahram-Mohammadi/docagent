[project]
name = "docagent"
version = "0.0.1"
description = "Agentic multimodal research assistant for complex documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docagent_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "services/api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
mypy_path = "services/api"
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["docagent_core", "docagent_api"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: needs a GPU and the running Docker stack (skipped in CI)",
]

[tool.coverage.run]
source = ["docagent_core", "docagent_api"]
